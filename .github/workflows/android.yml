name: Build APK Android

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Construire l'application web
        run: npm run build

      - name: Synchroniser Capacitor (Android)
        run: npx cap sync android

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (secrets optionnels)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/AnalyseChess-v${VERSION}.apk"

      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: AnalyseChess-v${{ env.VERSION }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publier une release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AnalyseChess v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: |
            📱 **APK Android prêt à installer** — téléchargez `AnalyseChess-v${{ env.VERSION }}.apk` ci-dessous depuis votre téléphone.

            Branche : `${{ github.ref_name }}` · commit ${{ github.sha }}

            Première installation : autorisez l'installation d'applications depuis votre navigateur (« sources inconnues »).
